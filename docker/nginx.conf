server {
    listen 80;
    server_name _;

    # Proxy API calls to the FastAPI container (same contract as the Vite dev proxy:
    # the trailing slash strips the /api prefix, so /api/health -> http://api:8000/health).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Single-page app: serve static files, fall back to index.html for client routes.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
