[project]
name = "worldcup-2026-forecast-engine"
version = "0.1.0"
description = "Probabilistic forecasting engine for the 2026 FIFA World Cup (national teams, V1)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "pandera>=0.18",
    "tqdm>=4.68.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wc26"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["wc26"]
mypy_path = "src"
strict = true

# Third-party libraries without bundled type stubs.
[[tool.mypy.overrides]]
module = ["pandas.*", "pandera.*", "scipy.*"]
ignore_missing_imports = true

# The data module wraps untyped pandas/pandera calls; relax related noise there only.
[[tool.mypy.overrides]]
module = "wc26.data.*"
warn_return_any = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
